<script>
(function () {
  var D = JSON.parse(document.getElementById('d').textContent), K = 'bpw-key', gate = document.getElementById('gate'), err = document.getElementById('err');
  var bytes = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var text = new TextEncoder();
  if (!window.crypto || !crypto.subtle) { gate.style.display = 'block'; err.textContent = 'This page needs a secure (https) connection.'; return; }
  function decrypt(key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(D.v) }, key, bytes(D.c)).then(function (b) { return new TextDecoder().decode(b); }); }
  function show(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
  }
  function fromStore() {
    var k = null; try { k = localStorage.getItem(K); } catch (e) {}
    if (!k) return Promise.reject();
    return crypto.subtle.importKey('raw', bytes(k), 'AES-GCM', false, ['decrypt']).then(decrypt);
  }
  fromStore().then(show, function () { try { localStorage.removeItem(K); } catch (e) {} gate.style.display = 'block'; });
  gate.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = '';
    var pw = document.getElementById('pw').value;
    crypto.subtle.importKey('raw', text.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (m) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(D.s), iterations: D.i, hash: 'SHA-256' }, m, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    }).then(function (key) {
      return decrypt(key).then(function (html) {
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          try { localStorage.setItem(K, btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (x) {}
          show(html);
        });
      });
    }).catch(function () { err.textContent = 'That password is not right. Please try again.'; document.getElementById('pw').select(); });
  });
})();
</script></body></html>
